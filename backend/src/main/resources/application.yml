server:
  port: 8080
  # Behind Traefik/Next.js: use X-Forwarded-For so rate limits apply per visitor, not per proxy.
  forward-headers-strategy: native
spring:
  application:
    name: ilmpath-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ilmpath?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:ilmpath}
    password: ${DB_PASSWORD:ilmpath}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health
ilmpath:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-please-32b+}
    ttl-hours: 168
  cookie-secure: ${COOKIE_SECURE:false}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  admin:
    email: ${ILMPATH_ADMIN_EMAIL:}
    password: ${ILMPATH_ADMIN_PASSWORD:}
    name: ${ILMPATH_ADMIN_NAME:Administrator}
  seed-demo: ${ILMPATH_SEED_DEMO:false}
