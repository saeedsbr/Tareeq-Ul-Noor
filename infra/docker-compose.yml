# Optional: MySQL only. Run the API and web app locally (see README).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ilmpath
      MYSQL_USER: ilmpath
      MYSQL_PASSWORD: ilmpath
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    command: --character-set-server=utf8mb4
volumes:
  mysql-data:
